<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f3d23"/>
      <stop offset="70%" stop-color="#072214"/>
      <stop offset="100%" stop-color="#03120a"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Rounded Tile -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Ornate Border -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.9"/>
  <!-- Inner Delicate Filigree Border -->
  <rect x="52" y="52" width="408" height="408" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Corner 4 Suits of Spanish Deck -->
  <!-- Top Left: Oros (Gold coin) -->
  <g transform="translate(84, 84) scale(0.7)" filter="url(#goldShadow)">
    <circle cx="0" cy="0" r="28" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="20" fill="#0b2e1b"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)"/>
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#fef08a"/>
  </g>

  <!-- Top Right: Copas (Chalice) -->
  <g transform="translate(428, 84) scale(0.65)" filter="url(#goldShadow)">
    <path d="M-22,-20 L22,-20 C22,6 12,18 0,18 C-12,18 -22,6 -22,-20 Z" fill="url(#goldGrad)"/>
    <rect x="-4" y="14" width="8" height="16" fill="url(#goldGrad)"/>
    <ellipse cx="0" cy="30" rx="18" ry="6" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-6" r="5" fill="#fef08a"/>
  </g>

  <!-- Bottom Left: Espadas (Sword) -->
  <g transform="translate(84, 428) scale(0.65)" filter="url(#goldShadow)">
    <path d="M0,-30 L7,-4 L5,16 L-5,16 L-7,-4 Z" fill="url(#goldGrad)"/>
    <rect x="-18" y="15" width="36" height="5" rx="2" fill="url(#goldGrad)"/>
    <rect x="-3" y="19" width="6" height="12" fill="url(#goldGrad)"/>
    <circle cx="0" cy="33" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Bottom Right: Bastos (Club) -->
  <g transform="translate(428, 428) scale(0.65)" filter="url(#goldShadow)">
    <path d="M-6,30 L6,30 L11,-16 C11,-24 4,-32 0,-32 C-4,-32 -11,-24 -11,-16 Z" fill="url(#goldGrad)"/>
    <circle cx="-10" cy="-6" r="4" fill="#fef08a"/>
    <circle cx="10" cy="6" r="4" fill="#fef08a"/>
    <circle cx="-8" cy="16" r="3" fill="#fef08a"/>
  </g>

  <!-- Center Monarch Crown -->
  <g transform="translate(256, 175) scale(1.1)" filter="url(#goldShadow)">
    <!-- Crown Base -->
    <path d="M-60,30 L60,30 L52,40 L-52,40 Z" fill="url(#goldGrad)"/>
    <circle cx="-40" cy="35" r="3" fill="#062113"/>
    <circle cx="-20" cy="35" r="3" fill="#fef08a"/>
    <circle cx="0" cy="35" r="3.5" fill="#ef4444"/>
    <circle cx="20" cy="35" r="3" fill="#fef08a"/>
    <circle cx="40" cy="35" r="3" fill="#062113"/>
    <!-- Crown Spikes -->
    <path d="M-60,30 L-70,0 L-35,16 L0,-12 L35,16 L70,0 L60,30 Z" fill="url(#goldGrad)"/>
    <circle cx="-70" cy="0" r="5" fill="#fef08a"/>
    <circle cx="-35" cy="16" r="4.5" fill="#fef08a"/>
    <circle cx="0" cy="-12" r="7" fill="#fef08a"/>
    <circle cx="35" cy="16" r="4.5" fill="#fef08a"/>
    <circle cx="70" cy="0" r="5" fill="#fef08a"/>
  </g>

  <!-- Center "RC" Monogram with Golden Roman Typography -->
  <g transform="translate(256, 315)" filter="url(#goldShadow)">
    <!-- Decorative Aureole behind letters -->
    <circle cx="0" cy="-5" r="78" fill="#072b18" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="-5" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
    
    <text x="0" y="24" 
          font-family="'Cinzel', 'Times New Roman', serif" 
          font-size="74" 
          font-weight="900" 
          letter-spacing="2"
          text-anchor="middle" 
          fill="url(#goldGrad)">
      RC
    </text>
  </g>

  <!-- Bottom banner badge: CARTAS -->
  <g transform="translate(256, 420)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0a321d" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="5" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#fef08a">
      CARTAS
    </text>
  </g>
</svg>
